###############################################################################
#  3D Print Manager für Home Assistant
#  Version: 0.1.1-beta
#  Repository: https://github.com/3dsiedler/ha-3d-print-manager
#  Lizenz: GPL-3.0
#
#  Voraussetzungen:
#    - Klipper-Drucker mit Moonraker (getestet: Sovol SV08)
#    - Moonraker-Integration in Home Assistant (HACS: "Moonraker")
#    - Spoolman oder FilaMan (Spoolman-kompatible API), mit Moonraker verbunden
#    - optional: Steckdose mit Energiezähler für den Drucker
#    - optional: KI-Integration mit "AI Task" (Fotoerkennung Typenschild)
#
#  Installation: siehe README.md
#
#  >>> ANPASSEN: nur Abschnitt 1 ("Druckeranbindung") <<<
#  Alle anderen Einstellungen (Moonraker-URL, Spoolman-URL, Lagerorte …)
#  werden nach dem Neustart im Dashboard unter "Einstellungen" eingetragen.
###############################################################################

template:
  #############################################################################
  # 1. DRUCKERANBINDUNG – hier die Entitäten DEINES Druckers eintragen.
  #    Beispiel Sovol SV08: Präfix "sovol_sv08". Bei anderem Druckernamen
  #    einfach "sovol_sv08" durch dein Präfix ersetzen (Suchen & Ersetzen
  #    NUR in diesem Abschnitt).
  #############################################################################
  - sensor:
      - name: "PM Druckstatus"
        unique_id: pm_druckstatus
        icon: mdi:printer-3d
        state: "{{ states('sensor.sovol_sv08_current_print_state') }}"
        availability: "{{ has_value('sensor.sovol_sv08_current_print_state') }}"

      - name: "PM Fortschritt"
        unique_id: pm_fortschritt
        icon: mdi:progress-clock
        unit_of_measurement: "%"
        state: "{{ states('sensor.sovol_sv08_progress') | float(0) | round(1) }}"
        availability: "{{ has_value('sensor.sovol_sv08_progress') }}"

      - name: "PM Restzeit"
        unique_id: pm_restzeit
        icon: mdi:timer-sand
        unit_of_measurement: "h"
        device_class: duration
        state: "{{ states('sensor.sovol_sv08_print_time_left') | float(0) | round(2) }}"
        availability: "{{ has_value('sensor.sovol_sv08_print_time_left') }}"

      - name: "PM Druckende"
        unique_id: pm_druckende
        icon: mdi:flag-checkered
        device_class: timestamp
        state: "{{ states('sensor.sovol_sv08_print_eta') }}"
        availability: "{{ has_value('sensor.sovol_sv08_print_eta') }}"

      - name: "PM Dateiname"
        unique_id: pm_dateiname
        icon: mdi:file-code-outline
        state: "{{ states('sensor.sovol_sv08_filename') }}"
        availability: "{{ has_value('sensor.sovol_sv08_filename') }}"

      - name: "PM Schicht"
        unique_id: pm_schicht
        icon: mdi:layers-outline
        state: "{{ states('sensor.sovol_sv08_current_layer') | int(0) }}"
        availability: "{{ has_value('sensor.sovol_sv08_current_layer') }}"

      - name: "PM Schichten gesamt"
        unique_id: pm_schichten_gesamt
        icon: mdi:layers-triple-outline
        state: "{{ states('sensor.sovol_sv08_total_layer') | int(0) }}"
        availability: "{{ has_value('sensor.sovol_sv08_total_layer') }}"

      # Filamentverbrauch des laufenden Drucks in Metern (Moonraker "Filament Used")
      - name: "PM Filament verbraucht"
        unique_id: pm_filament_verbraucht
        icon: mdi:printer-3d-nozzle-outline
        unit_of_measurement: "m"
        state_class: total_increasing
        state: "{{ states('sensor.sovol_sv08_filament_used') | float(0) }}"
        availability: "{{ has_value('sensor.sovol_sv08_filament_used') }}"

      # Druckdauer des laufenden Drucks in Minuten
      - name: "PM Druckdauer"
        unique_id: pm_druckdauer
        icon: mdi:timer-outline
        unit_of_measurement: "min"
        state: "{{ states('sensor.sovol_sv08_print_duration') | float(0) | round(1) }}"
        availability: "{{ has_value('sensor.sovol_sv08_print_duration') }}"

      # Energiezähler (kWh, steigend) der Drucker-Steckdose.
      # Ohne Steckdose: so lassen – die Stromkosten werden dann über den
      # Erfahrungswert "kWh pro Druckstunde" geschätzt.
      - name: "PM Energie Drucker"
        unique_id: pm_energie_drucker
        icon: mdi:lightning-bolt
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ states('sensor.3d_sovol_sv08_energy') | float(0) }}"
        availability: "{{ has_value('sensor.3d_sovol_sv08_energy') }}"

      # Strompreis in EUR/kWh. Standard: das Eingabefeld "Strompreis (manuell)".
      # Wer einen dynamischen Strompreis-Sensor hat, trägt ihn hier ein.
      - name: "PM Strompreis"
        unique_id: pm_strompreis
        icon: mdi:currency-eur
        unit_of_measurement: "EUR/kWh"
        state: "{{ states('input_number.pm_strompreis_manuell') | float(0) }}"
  #############################################################################
  # ENDE Druckeranbindung – ab hier nichts mehr ändern
  #############################################################################

  # Laufende Kosten des aktuellen Drucks
  - sensor:
      - name: "PM Filament aktueller Druck"
        unique_id: pm_filament_aktueller_druck
        icon: mdi:weight-gram
        unit_of_measurement: "g"
        device_class: weight
        state_class: measurement
        state: "{{ states('input_number.pm_filament_laufender_druck') | float(0) | round(1) }}"
      - name: "PM Filamentkosten aktueller Druck"
        unique_id: pm_filamentkosten_aktueller_druck
        icon: mdi:cash
        unit_of_measurement: "EUR"
        device_class: monetary
        state: "{{ states('input_number.pm_filamentkosten_laufender_druck') | float(0) | round(2) }}"
      - name: "PM Stromkosten aktueller Druck"
        unique_id: pm_stromkosten_aktueller_druck
        icon: mdi:cash
        unit_of_measurement: "EUR"
        device_class: monetary
        state: "{{ states('input_number.pm_stromkosten_laufender_druck') | float(0) | round(2) }}"
      - name: "PM Druckkosten aktueller Druck"
        unique_id: pm_druckkosten_aktueller_druck
        icon: mdi:cash-multiple
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >-
          {{ (states('input_number.pm_filamentkosten_laufender_druck') | float(0)
            + states('input_number.pm_stromkosten_laufender_druck') | float(0)) | round(2) }}

utility_meter:
  pm_energie_aktueller_druck:
    name: "PM Energie aktueller Druck"
    unique_id: pm_energie_aktueller_druck
    source: sensor.pm_energie_drucker
    periodically_resetting: true

